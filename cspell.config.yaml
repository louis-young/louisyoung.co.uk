version: "0.2"
language: en-GB
dictionaries: [en-gb, typescript, node, html, css, softwareTerms, companies, fullstack]
ignorePaths:
  - pnpm-lock.yaml
  - dist
  - src/i18n/pseudo.ts
ignoreRegExpList:
  - '/sha256-[A-Za-z0-9+\/=]+/g'
  - '/codesandbox\.io\/[^\s"]+/g'
  - '/\b[a-z0-9]+-[a-z0-9]{5}\b/g'
  # Unix file modes as ls -l prints them, e.g. drwxr-xr-x, and the file-type letters before them.
  - "/[-d]?[r-][w-][xsS-][r-][w-][xsS-][r-][w-][xtT-]/g"
  - '/\[-dlcbps\]/g'
  # JSON Web Tokens: a base64url-encoded JSON object always starts eyJ.
  - '/\beyJ[\w-]*/g'
words:
  - aeiou
  - alnum
  - astro
  - astrojs
  - autem
  - autolink
